name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project and build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/.gradle/*" | sort)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/.gradle/*" | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project files were not found."
            echo "The repository must contain settings.gradle(.kts) or build.gradle(.kts)."
            exit 1
          fi

          echo "Android project folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find and upload APK
        shell: bash
        run: |
          set -e
          APK_PATH="$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/apk-output/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Emergency-RGB-Light-debug-apk
          path: apk-output/app-debug.apk
          if-no-files-found: error
